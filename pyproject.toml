[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-web-form-input-schema-auto-mapper-skill"
version = "1.0.0"
description = "Autonomous web form inspector and schema auto-mapper matching input attributes, autocomplete hints, and regex validations to agent state."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "GenPark AI", email = "engineering@genpark.ai"}]
keywords = ["ai-agent", "mcp", "web-browsing", "dom-pruning", "zero-dependency"]
dependencies = []

[project.urls]
Homepage = "https://genpark.ai/mcp"
Repository = "https://github.com/alphaparkinc/genpark-web-form-input-schema-auto-mapper-skill"
